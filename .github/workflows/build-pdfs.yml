name: Build PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'config/**'
      - 'Makefile'
      - '.github/workflows/build-pdfs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'config/**'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Pandoc
      run: |
        PANDOC_VERSION=3.1.11
        wget -nv https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb
        sudo dpkg -i pandoc-${PANDOC_VERSION}-1-amd64.deb
        pandoc --version
    
    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-plain-generic \
          texlive-lang-cjk \
          fonts-noto-cjk \
          fonts-noto-cjk-extra \
          fonts-texgyre \
          fonts-unfonts-core
    
    - name: Update font cache and verify
      run: |
        sudo fc-cache -fv
        echo "=== Verificando fontes instaladas ==="
        fc-list : family | grep -E "Pagella|UnBatang" || echo "Fontes instaladas"
    
    - name: Verify build environment
      run: |
        echo "=== Environment Check ==="
        pandoc --version | head -2
        xelatex --version | head -1
        echo "=== Directory structure ==="
        ls -la docs/ config/
    
    - name: Build PDFs
      run: |
        make clean
        make all
    
    - name: List generated files
      run: |
        echo "=== Generated PDFs ==="
        ls -lh build/
    
    - name: Upload PDF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdfs-${{ github.sha }}
        path: build/*.pdf
        retention-days: 90
        if-no-files-found: error
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.pdf
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
